name: paper
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python scripts/paper_update.py
      - name: Commit results
        run: |
          git config user.name "btc15-bot"
          git config user.email "btc15-bot@users.noreply.github.com"
          git add results/windows.csv results/paper_start.txt results/summary.md
          git diff --cached --quiet && exit 0
          git commit -m "paper update"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
