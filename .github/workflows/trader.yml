name: trader
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trader
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      LIVE_TRADING: ${{ vars.LIVE_TRADING }}
      PM_KEY_ID: ${{ secrets.PM_KEY_ID }}
      PM_SECRET: ${{ secrets.PM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml polymarket-us
      - name: Run trade loop (up to 5h50m)
        run: python scripts/trade_loop.py
      - name: Commit logs
        if: always()
        run: |
          git config user.name "btc15-bot"
          git config user.email "btc15-bot@users.noreply.github.com"
          git add results/live_trades.csv results/state.json
          git diff --cached --quiet && exit 0
          git commit -m "trader log"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
